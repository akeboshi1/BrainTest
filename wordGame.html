<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>成语诗词填空游戏</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .game-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            padding: 40px;
            max-width: 800px;
            width: 100%;
            text-align: center;
        }

        .title {
            font-size: 2.5rem;
            color: #333;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .subtitle {
            font-size: 1.2rem;
            color: #666;
            margin-bottom: 40px;
        }

        .menu-container {
            display: flex;
            gap: 30px;
            justify-content: center;
            margin-bottom: 40px;
        }

        .menu-button {
            background: linear-gradient(45deg, #4CAF50, #45a049);
            color: white;
            border: none;
            padding: 25px 40px;
            font-size: 1.5rem;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 16px rgba(0,0,0,0.2);
            min-width: 200px;
        }

        .menu-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 24px rgba(0,0,0,0.3);
        }

        .menu-button:active {
            transform: translateY(0);
        }

        .game-area {
            display: none;
            margin-top: 30px;
        }

        .question-area {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
            border: 3px solid #e9ecef;
        }

        .question-text {
            font-size: 2.2rem;
            color: #333;
            line-height: 1.8;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .blank {
            display: inline-block;
            background: #fff;
            border: 3px solid #007bff;
            border-radius: 8px;
            padding: 8px 15px;
            margin: 0 5px;
            min-width: 60px;
            height: 50px;
            line-height: 34px;
            font-size: 1.8rem;
            font-weight: bold;
            color: #007bff;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .blank:hover {
            background: #e3f2fd;
            transform: scale(1.05);
        }

        .blank.filled {
            background: #e8f5e8;
            border-color: #28a745;
            color: #28a745;
        }

        .blank.correct {
            background: #d4edda;
            border-color: #28a745;
            color: #28a745;
            animation: correctPulse 0.6s ease;
        }

        .blank.wrong {
            background: #f8d7da;
            border-color: #dc3545;
            color: #dc3545;
            animation: wrongShake 0.6s ease;
        }

        @keyframes correctPulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        @keyframes wrongShake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        .options-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }

        .option-button {
            background: #fff;
            border: 3px solid #6c757d;
            border-radius: 12px;
            padding: 20px;
            font-size: 1.4rem;
            font-weight: bold;
            color: #333;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        .option-button:hover {
            background: #f8f9fa;
            border-color: #007bff;
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.15);
        }

        .option-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .control-buttons {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-top: 30px;
        }

        .control-button {
            background: #6c757d;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.2rem;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .control-button:hover {
            background: #5a6268;
            transform: translateY(-2px);
        }

        .control-button.primary {
            background: #007bff;
        }

        .control-button.primary:hover {
            background: #0056b3;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
        }

        .modal-content {
            background-color: white;
            margin: 15% auto;
            padding: 30px;
            border-radius: 15px;
            width: 80%;
            max-width: 500px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }

        .modal-title {
            font-size: 1.8rem;
            color: #333;
            margin-bottom: 20px;
        }

        .modal-message {
            font-size: 1.3rem;
            color: #666;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .modal-button {
            background: #007bff;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.2rem;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .modal-button:hover {
            background: #0056b3;
        }

        .score-display {
            font-size: 1.3rem;
            color: #333;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .progress-bar {
            width: 100%;
            height: 10px;
            background: #e9ecef;
            border-radius: 5px;
            overflow: hidden;
            margin-bottom: 20px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #28a745, #20c997);
            transition: width 0.3s ease;
        }

        @media (max-width: 768px) {
            .game-container {
                padding: 20px;
            }
            
            .title {
                font-size: 2rem;
            }
            
            .menu-container {
                flex-direction: column;
                align-items: center;
            }
            
            .question-text {
                font-size: 1.8rem;
            }
            
            .blank {
                font-size: 1.5rem;
                min-width: 50px;
                height: 45px;
            }
            
            .option-button {
                font-size: 1.2rem;
                padding: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1 class="title">成语诗词填空游戏</h1>
        <p class="subtitle">挑战您的文学知识，享受学习的乐趣</p>
        
        <!-- 主菜单 -->
        <div id="mainMenu" class="menu-container">
            <button class="menu-button" onclick="startGame('idiom')">成语填空</button>
            <button class="menu-button" onclick="startGame('poetry')">诗词填空</button>
        </div>

        <!-- 游戏区域 -->
        <div id="gameArea" class="game-area">
            <div class="score-display">
                得分: <span id="score">0</span> | 进度: <span id="progress">0</span>/<span id="total">0</span>
            </div>
            <div class="progress-bar">
                <div class="progress-fill" id="progressBar"></div>
            </div>
            
            <div class="question-area">
                <div class="question-text" id="questionText"></div>
            </div>
            
            <div class="options-container" id="optionsContainer"></div>
            
            <div class="control-buttons">
                <button class="control-button" onclick="showHint()">提示</button>
                <button class="control-button primary" onclick="nextQuestion()">下一题</button>
                <button class="control-button" onclick="backToMenu()">返回菜单</button>
            </div>
        </div>
    </div>

    <!-- 结果弹窗 -->
    <div id="resultModal" class="modal">
        <div class="modal-content">
            <h2 class="modal-title" id="modalTitle">答题结果</h2>
            <p class="modal-message" id="modalMessage"></p>
            <button class="modal-button" onclick="closeModal()">确定</button>
        </div>
    </div>

    <script>
        // 游戏数据
        const gameData = {
            idiom: [
                {
                    text: "一马当先",
                    blanks: [1], // 隐藏第1个字
                    options: ["马", "牛", "羊", "猪"]
                },
                {
                    text: "画蛇添足",
                    blanks: [2], // 隐藏第2个字
                    options: ["添", "加", "增", "补"]
                },
                {
                    text: "守株待兔",
                    blanks: [3], // 隐藏第3个字
                    options: ["兔", "鸡", "鸭", "鹅"]
                },
                {
                    text: "亡羊补牢",
                    blanks: [0], // 隐藏第0个字
                    options: ["亡", "失", "丢", "没"]
                },
                {
                    text: "井底之蛙",
                    blanks: [2], // 隐藏第2个字
                    options: ["之", "的", "是", "为"]
                },
                {
                    text: "狐假虎威",
                    blanks: [1], // 隐藏第1个字
                    options: ["假", "借", "装", "扮"]
                },
                {
                    text: "对牛弹琴",
                    blanks: [3], // 隐藏第3个字
                    options: ["琴", "筝", "瑟", "箫"]
                },
                {
                    text: "叶公好龙",
                    blanks: [0], // 隐藏第0个字
                    options: ["叶", "花", "草", "树"]
                },
                {
                    text: "刻舟求剑",
                    blanks: [2], // 隐藏第2个字
                    options: ["求", "找", "寻", "觅"]
                },
                {
                    text: "掩耳盗铃",
                    blanks: [1], // 隐藏第1个字
                    options: ["耳", "目", "鼻", "口"]
                },
                {
                    text: "杯弓蛇影",
                    blanks: [2], // 隐藏第2个字
                    options: ["蛇", "龙", "虎", "豹"]
                },
                {
                    text: "指鹿为马",
                    blanks: [3], // 隐藏第3个字
                    options: ["马", "牛", "羊", "猪"]
                }
            ],
            poetry: [
                {
                    text: "床前明月光",
                    blanks: [1, 2], // 隐藏第1、2个字
                    options: ["前明", "后暗", "上清", "下浊"]
                },
                {
                    text: "疑是地上霜",
                    blanks: [0], // 隐藏第0个字
                    options: ["疑", "像", "似", "如"]
                },
                {
                    text: "举头望明月",
                    blanks: [2], // 隐藏第2个字
                    options: ["望", "看", "观", "瞧"]
                },
                {
                    text: "低头思故乡",
                    blanks: [1, 3], // 隐藏第1、3个字
                    options: ["头故", "脑家", "心国", "意乡"]
                },
                {
                    text: "春眠不觉晓",
                    blanks: [2], // 隐藏第2个字
                    options: ["觉", "知", "感", "悟"]
                },
                {
                    text: "处处闻啼鸟",
                    blanks: [1], // 隐藏第1个字
                    options: ["处", "地", "方", "所"]
                },
                {
                    text: "夜来风雨声",
                    blanks: [0, 2], // 隐藏第0、2个字
                    options: ["夜风", "日雨", "晨雪", "夕雷"]
                },
                {
                    text: "花落知多少",
                    blanks: [1], // 隐藏第1个字
                    options: ["落", "谢", "凋", "败"]
                },
                {
                    text: "白日依山尽",
                    blanks: [2], // 隐藏第2个字
                    options: ["依", "靠", "傍", "贴"]
                },
                {
                    text: "黄河入海流",
                    blanks: [1], // 隐藏第1个字
                    options: ["河", "江", "水", "流"]
                },
                {
                    text: "欲穷千里目",
                    blanks: [0], // 隐藏第0个字
                    options: ["欲", "想", "要", "愿"]
                },
                {
                    text: "更上一层楼",
                    blanks: [2], // 隐藏第2个字
                    options: ["一", "二", "三", "四"]
                }
            ]
        };

        // 游戏状态
        let currentGameType = '';
        let currentQuestionIndex = 0;
        let score = 0;
        let currentQuestion = null;
        let selectedBlankIndex = -1;
        let correctAnswers = 0;

        // 开始游戏
        function startGame(gameType) {
            currentGameType = gameType;
            currentQuestionIndex = 0;
            score = 0;
            correctAnswers = 0;
            selectedBlankIndex = -1;
            
            document.getElementById('mainMenu').style.display = 'none';
            document.getElementById('gameArea').style.display = 'block';
            
            loadQuestion();
        }

        // 加载题目
        function loadQuestion() {
            const questions = gameData[currentGameType];
            if (currentQuestionIndex >= questions.length) {
                showGameComplete();
                return;
            }

            currentQuestion = questions[currentQuestionIndex];
            selectedBlankIndex = -1;
            
            // 更新进度
            document.getElementById('progress').textContent = currentQuestionIndex + 1;
            document.getElementById('total').textContent = questions.length;
            document.getElementById('score').textContent = score;
            
            // 更新进度条
            const progressPercent = ((currentQuestionIndex + 1) / questions.length) * 100;
            document.getElementById('progressBar').style.width = progressPercent + '%';
            
            // 显示题目
            displayQuestion();
            displayOptions();
        }

        // 显示题目
        function displayQuestion() {
            const questionText = document.getElementById('questionText');
            let displayText = '';
            
            for (let i = 0; i < currentQuestion.text.length; i++) {
                if (currentQuestion.blanks.includes(i)) {
                    displayText += `<span class="blank" onclick="selectBlank(${i})" id="blank-${i}">_</span>`;
                } else {
                    displayText += currentQuestion.text[i];
                }
            }
            
            questionText.innerHTML = displayText;
        }

        // 显示选项
        function displayOptions() {
            const optionsContainer = document.getElementById('optionsContainer');
            optionsContainer.innerHTML = '';
            
            // 打乱选项顺序
            const shuffledOptions = [...currentQuestion.options].sort(() => Math.random() - 0.5);
            
            shuffledOptions.forEach((option, index) => {
                const button = document.createElement('button');
                button.className = 'option-button';
                button.textContent = option;
                button.onclick = () => selectOption(option, index);
                optionsContainer.appendChild(button);
            });
        }

        // 选择空白处
        function selectBlank(blankIndex) {
            // 清除之前的选择
            document.querySelectorAll('.blank').forEach(blank => {
                blank.style.borderColor = '#007bff';
                blank.style.backgroundColor = '#fff';
            });
            
            // 高亮当前选择
            const blank = document.getElementById(`blank-${blankIndex}`);
            blank.style.borderColor = '#ffc107';
            blank.style.backgroundColor = '#fff3cd';
            
            selectedBlankIndex = blankIndex;
        }

        // 选择选项
        function selectOption(option, optionIndex) {
            if (selectedBlankIndex === -1) {
                showModal('提示', '请先点击要填空的位置！');
                return;
            }

            const blank = document.getElementById(`blank-${selectedBlankIndex}`);
            blank.textContent = option;
            blank.classList.add('filled');
            
            // 检查答案
            const correctAnswer = getCorrectAnswer(selectedBlankIndex);
            const isCorrect = option === correctAnswer;
            
            if (isCorrect) {
                blank.classList.add('correct');
                score += 10;
                correctAnswers++;
                showModal('正确！', `恭喜您答对了！正确答案是：${correctAnswer}`);
            } else {
                blank.classList.add('wrong');
                showModal('错误', `正确答案是：${correctAnswer}`);
            }
            
            // 禁用所有选项
            document.querySelectorAll('.option-button').forEach(btn => {
                btn.disabled = true;
            });
            
            // 更新分数
            document.getElementById('score').textContent = score;
        }

        // 获取正确答案
        function getCorrectAnswer(blankIndex) {
            const originalText = currentQuestion.text;
            return originalText[blankIndex];
        }

        // 显示提示
        function showHint() {
            if (selectedBlankIndex === -1) {
                showModal('提示', '请先点击要填空的位置！');
                return;
            }
            
            const correctAnswer = getCorrectAnswer(selectedBlankIndex);
            showModal('提示', `这个位置的正确答案是：${correctAnswer}`);
        }

        // 下一题
        function nextQuestion() {
            currentQuestionIndex++;
            loadQuestion();
        }

        // 返回菜单
        function backToMenu() {
            document.getElementById('gameArea').style.display = 'none';
            document.getElementById('mainMenu').style.display = 'flex';
        }

        // 显示弹窗
        function showModal(title, message) {
            document.getElementById('modalTitle').textContent = title;
            document.getElementById('modalMessage').textContent = message;
            document.getElementById('resultModal').style.display = 'block';
        }

        // 关闭弹窗
        function closeModal() {
            document.getElementById('resultModal').style.display = 'none';
        }

        // 游戏完成
        function showGameComplete() {
            const accuracy = Math.round((correctAnswers / gameData[currentGameType].length) * 100);
            const message = `游戏完成！\n\n总得分：${score}\n正确率：${accuracy}%\n\n${accuracy >= 80 ? '太棒了！您表现优秀！' : accuracy >= 60 ? '不错！继续加油！' : '需要多加练习哦！'}`;
            showModal('游戏完成', message);
        }

        // 点击弹窗外部关闭
        window.onclick = function(event) {
            const modal = document.getElementById('resultModal');
            if (event.target === modal) {
                closeModal();
            }
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数字左右滑动倒计时</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #2c3e50 0%, #34495e 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .countdown-container {
            position: relative;
            width: 600px;
            height: 300px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 
                0 20px 40px rgba(0, 0, 0, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.2);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* 数字显示区域 */
        .number-display {
            position: relative;
            width: 400px;
            height: 150px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 30px;
        }

        /* 数字容器 */
        .number-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 数字样式 */
        .countdown-number {
            position: absolute;
            font-size: 8rem;
            font-weight: 900;
            color: #fff;
            text-shadow: 
                0 0 30px rgba(255, 255, 255, 0.8),
                0 0 60px rgba(52, 152, 219, 0.6),
                0 5px 15px rgba(0, 0, 0, 0.3);
            user-select: none;
            line-height: 1;
            background: linear-gradient(135deg, #3498db, #2980b9);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            cursor: pointer;
            transition: all 0.3s ease;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            /* 确保数字默认可见 */
            opacity: 1;
            z-index: 1;
        }

        .countdown-number:hover {
            transform: translate(-50%, -50%) scale(1.05);
            filter: drop-shadow(0 0 20px rgba(52, 152, 219, 0.8));
        }

        .countdown-number:active {
            transform: translate(-50%, -50%) scale(0.95);
        }

        /* 同步滑动动画 - 当前数字向右滑出 */
        .slide-out-right {
            animation: slideOut 0.6s ease forwards;
        }

        @keyframes slideOut {
            from {
                transform: translate(-50%, -50%);
                opacity: 1;
            }
            to {
                transform: translate(150%, -50%);
                opacity: 0;
            }
        }

        /* 同步滑动动画 - 新数字从左滑入 */
        .slide-in-left {
            animation: slideIn 0.6s ease forwards;
        }

        @keyframes slideIn {
            from {
                transform: translate(-150%, -50%);
                opacity: 0;
            }
            to {
                transform: translate(-50%, -50%);
                opacity: 1;
            }
        }

        /* 状态文字 */
        .status-text {
            font-size: 1.5rem;
            color: rgba(255, 255, 255, 0.9);
            font-weight: 500;
            margin-bottom: 20px;
            text-align: center;
            transition: all 0.3s ease;
        }

        .status-text.highlight {
            color: #3498db;
            transform: scale(1.1);
        }

        /* 进度条 */
        .progress-container {
            width: 80%;
            height: 6px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 3px;
            overflow: hidden;
            margin-bottom: 30px;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #3498db, #2980b9);
            border-radius: 3px;
            transition: width 1s ease-in-out;
            box-shadow: 0 0 10px rgba(52, 152, 219, 0.6);
        }

        /* 控制按钮 */
        .controls {
            display: flex;
            gap: 20px;
        }

        .control-btn {
            padding: 15px 30px;
            border: none;
            border-radius: 25px;
            background: linear-gradient(135deg, #3498db, #2980b9);
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 
                0 8px 20px rgba(52, 152, 219, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.2);
            user-select: none;
            position: relative;
            overflow: hidden;
        }

        .control-btn:hover {
            transform: translateY(-2px);
            box-shadow: 
                0 12px 25px rgba(52, 152, 219, 0.4),
                inset 0 1px 0 rgba(255, 255, 255, 0.2);
        }

        .control-btn:active {
            transform: translateY(0);
        }

        .control-btn:disabled {
            background: #7f8c8d;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .control-btn.reset {
            background: linear-gradient(135deg, #e74c3c, #c0392b);
            box-shadow: 
                0 8px 20px rgba(231, 76, 60, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.2);
        }

        .control-btn.reset:hover {
            box-shadow: 
                0 12px 25px rgba(231, 76, 60, 0.4),
                inset 0 1px 0 rgba(255, 255, 255, 0.2);
        }

        /* 按钮点击波纹效果 */
        .control-btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .control-btn:active::before {
            width: 300px;
            height: 300px;
        }

        /* 完成动画覆盖层 */
        .completion-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, rgba(46, 204, 113, 0.95), rgba(39, 174, 96, 0.95));
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transform: scale(0.8);
            transition: all 0.5s ease;
            z-index: 100;
            backdrop-filter: blur(15px);
        }

        .completion-overlay.show {
            opacity: 1;
            transform: scale(1);
        }

        .completion-text {
            font-size: 6rem;
            color: white;
            font-weight: 300;
            margin-bottom: 20px;
            text-shadow: 0 3px 15px rgba(0, 0, 0, 0.3);
            animation: bounceIn 1s ease-out;
        }

        .completion-subtitle {
            font-size: 2.5rem;
            color: rgba(255, 255, 255, 0.9);
            font-weight: 400;
            animation: fadeInUp 1s ease-out 0.3s both;
        }

        @keyframes bounceIn {
            0% {
                opacity: 0;
                transform: scale(0.3) translateY(-100px);
            }
            50% {
                opacity: 1;
                transform: scale(1.05) translateY(0);
            }
            70% {
                transform: scale(0.9);
            }
            100% {
                transform: scale(1);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 粒子效果 */
        .particle {
            position: absolute;
            width: 8px;
            height: 8px;
            background: #3498db;
            border-radius: 50%;
            pointer-events: none;
            opacity: 0;
        }

        .particle.animate {
            animation: particleFloat 2s ease-out forwards;
        }

        @keyframes particleFloat {
            0% {
                opacity: 1;
                transform: translateY(0) scale(1) rotate(0deg);
            }
            100% {
                opacity: 0;
                transform: translateY(-120px) scale(0) rotate(360deg);
            }
        }

        /* 数字发光效果 */
        .countdown-number.glow {
            animation: numberGlow 0.8s ease-in-out;
        }

        @keyframes numberGlow {
            0%, 100% {
                text-shadow: 
                    0 0 30px rgba(255, 255, 255, 0.8),
                    0 0 60px rgba(52, 152, 219, 0.6),
                    0 5px 15px rgba(0, 0, 0, 0.3);
            }
            50% {
                text-shadow: 
                    0 0 50px rgba(255, 255, 255, 1),
                    0 0 100px rgba(52, 152, 219, 0.9),
                    0 5px 25px rgba(0, 0, 0, 0.3);
            }
        }

        /* 暂停按钮 */
        .pause-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            padding: 10px 20px;
            border: none;
            border-radius: 20px;
            background: linear-gradient(135deg, #f39c12, #e67e22);
            color: white;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(243, 156, 18, 0.3);
            opacity: 0;
            transform: translateY(-10px);
        }

        .pause-btn.show {
            opacity: 1;
            transform: translateY(0);
        }

        .pause-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(243, 156, 18, 0.4);
        }

        /* 操作提示 */
        .hint-text {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.6);
            text-align: center;
            opacity: 1;
            transition: opacity 0.3s ease;
        }

        .hint-text.hidden {
            opacity: 0;
        }

        /* 音效指示器 */
        .sound-indicator {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #9b59b6, #8e44ad);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(155, 89, 182, 0.3);
        }

        .sound-indicator:hover {
            transform: scale(1.1);
        }

        .sound-indicator.muted {
            background: #7f8c8d;
            box-shadow: 0 4px 15px rgba(127, 140, 141, 0.3);
        }

        /* 点击波纹效果增强 */
        .ripple {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.6);
            transform: scale(0);
            animation: rippleEffect 0.6s linear;
            pointer-events: none;
        }

        @keyframes rippleEffect {
            to {
                transform: scale(4);
                opacity: 0;
            }
        }

        /* 加速动画 */
        @keyframes speedBoostAnim {
            0% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
            50% {
                opacity: 1;
                transform: translateY(-20px) scale(1.5);
            }
            100% {
                opacity: 0;
                transform: translateY(-40px) scale(0.5);
            }
        }

        /* 淡入淡出动画 */
        @keyframes fadeInOut {
            0%, 100% {
                opacity: 0;
                transform: translateY(-50%) scale(0.8);
            }
            15%, 85% {
                opacity: 1;
                transform: translateY(-50%) scale(1);
            }
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            .countdown-container {
                width: 90%;
                height: 250px;
            }
            
            .countdown-number {
                font-size: 6rem;
            }
            
            .status-text {
                font-size: 1.2rem;
            }
            
            .completion-text {
                font-size: 4rem;
            }
            
            .completion-subtitle {
                font-size: 1.8rem;
            }
        }
    </style>
</head>
<body>
    <div class="countdown-container">
        <!-- 音效指示器 -->
        <div class="sound-indicator" id="soundIndicator" title="点击切换音效">🔊</div>
        
        <!-- 暂停按钮 -->
        <button class="pause-btn" id="pauseBtn">暂停</button>
        
        <!-- 状态文字 -->
        <div class="status-text" id="statusText">准备开始</div>
        
        <!-- 数字显示区域 -->
        <div class="number-display" id="numberDisplay">
            <div class="number-container" id="numberContainer">
                <!-- 数字将通过JavaScript动态创建 -->
            </div>
        </div>
        
        <!-- 进度条 -->
        <div class="progress-container">
            <div class="progress-bar" id="progressBar" style="width: 100%;"></div>
        </div>
        
        <!-- 控制按钮 -->
        <div class="controls">
            <button class="control-btn" id="startBtn">开始倒计时</button>
            <button class="control-btn reset" id="resetBtn">重置</button>
        </div>
        
        <!-- 操作提示 */
        <div class="hint-text" id="hintText">
            空格键开始 | R键重置 | 点击数字加速 | 双击暂停
        </div>
    </div>

    <!-- 完成覆盖层 -->
    <div class="completion-overlay" id="completionOverlay">
        <div class="completion-text">🎉</div>
        <div class="completion-subtitle">倒计时完成！</div>
    </div>

    <script>
        class SlidingCountdown {
            constructor() {
                console.log('初始化数字滑动倒计时');
                
                this.numberDisplay = document.getElementById('numberDisplay');
                this.numberContainer = document.getElementById('numberContainer');
                this.statusText = document.getElementById('statusText');
                this.progressBar = document.getElementById('progressBar');
                this.startBtn = document.getElementById('startBtn');
                this.resetBtn = document.getElementById('resetBtn');
                this.pauseBtn = document.getElementById('pauseBtn');
                this.soundIndicator = document.getElementById('soundIndicator');
                this.hintText = document.getElementById('hintText');
                this.completionOverlay = document.getElementById('completionOverlay');
                
                this.currentNumber = 5;
                this.totalCount = 5;
                this.isRunning = false;
                this.isPaused = false;
                this.isMuted = false;
                this.timer = null;
                this.speed = 1; // 倍速控制
                
                this.statusTexts = {
                    5: '准备开始',
                    4: '倒计时中',
                    3: '准备就绪',
                    2: '即将开始',
                    1: '最后一秒',
                    0: '开始！'
                };
                
                this.setupEventListeners();
                this.initializeDisplay();
                this.hideHintAfterDelay();
                
                console.log('数字滑动倒计时初始化完成');
            }

            initializeDisplay() {
                console.log('开始初始化显示');
                // 清空容器并创建初始数字
                this.numberContainer.innerHTML = '';
                const initialNumber = this.createNewNumber(this.currentNumber);
                this.numberContainer.appendChild(initialNumber);
                this.countdownNumber = initialNumber;
                
                this.updateDisplay();
                console.log(`初始显示设置完成，显示数字: ${this.currentNumber}`);
            }

            setupEventListeners() {
                console.log('设置事件监听器');
                
                // 基础按钮事件
                this.startBtn.addEventListener('click', (e) => {
                    this.createRipple(e);
                    this.handleStartClick();
                });
                this.resetBtn.addEventListener('click', (e) => {
                    this.createRipple(e);
                    this.handleResetClick();
                });
                this.pauseBtn.addEventListener('click', () => this.handlePauseClick());
                
                // 数字点击事件 - 加速
                this.countdownNumber.addEventListener('click', (e) => {
                    this.createNumberRipple(e);
                    this.handleNumberClick();
                });
                
                // 数字双击事件 - 暂停
                this.countdownNumber.addEventListener('dblclick', () => {
                    this.handlePauseClick();
                });
                
                // 音效切换
                this.soundIndicator.addEventListener('click', () => {
                    this.toggleSound();
                });
                
                // 键盘事件增强
                document.addEventListener('keydown', (event) => {
                    switch(event.code) {
                        case 'Space':
                            event.preventDefault();
                            this.handleStartClick();
                            break;
                        case 'KeyR':
                            event.preventDefault();
                            this.handleResetClick();
                            break;
                        case 'KeyP':
                            event.preventDefault();
                            this.handlePauseClick();
                            break;
                        case 'KeyM':
                            event.preventDefault();
                            this.toggleSound();
                            break;
                        case 'ArrowUp':
                            event.preventDefault();
                            this.changeSpeed(0.5); // 加速
                            break;
                        case 'ArrowDown':
                            event.preventDefault();
                            this.changeSpeed(-0.5); // 减速
                            break;
                    }
                });
                
                // 窗口焦点事件
                window.addEventListener('blur', () => {
                    if (this.isRunning && !this.isPaused) {
                        this.handlePauseClick();
                    }
                });
                
                console.log('事件监听器设置完成');
            }

            createRipple(e) {
                const button = e.currentTarget;
                const rect = button.getBoundingClientRect();
                const size = Math.max(rect.width, rect.height);
                const x = e.clientX - rect.left - size / 2;
                const y = e.clientY - rect.top - size / 2;
                
                const ripple = document.createElement('div');
                ripple.className = 'ripple';
                ripple.style.width = ripple.style.height = size + 'px';
                ripple.style.left = x + 'px';
                ripple.style.top = y + 'px';
                
                button.appendChild(ripple);
                
                setTimeout(() => {
                    ripple.remove();
                }, 600);
            }

            createNumberRipple(e) {
                const number = e.currentTarget;
                const rect = number.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                
                const ripple = document.createElement('div');
                ripple.className = 'ripple';
                ripple.style.width = ripple.style.height = '100px';
                ripple.style.left = (x - 50) + 'px';
                ripple.style.top = (y - 50) + 'px';
                ripple.style.background = 'rgba(52, 152, 219, 0.6)';
                
                number.appendChild(ripple);
                
                setTimeout(() => {
                    ripple.remove();
                }, 600);
            }

            playSound(type = 'click') {
                if (this.isMuted) return;
                
                // 使用Web Audio API创建音效
                const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();
                
                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);
                
                switch(type) {
                    case 'click':
                        oscillator.frequency.setValueAtTime(800, audioContext.currentTime);
                        gainNode.gain.setValueAtTime(0.1, audioContext.currentTime);
                        gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.1);
                        break;
                    case 'tick':
                        oscillator.frequency.setValueAtTime(1000, audioContext.currentTime);
                        gainNode.gain.setValueAtTime(0.05, audioContext.currentTime);
                        gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.2);
                        break;
                    case 'complete':
                        oscillator.frequency.setValueAtTime(523, audioContext.currentTime); // C5
                        oscillator.frequency.setValueAtTime(659, audioContext.currentTime + 0.1); // E5
                        oscillator.frequency.setValueAtTime(784, audioContext.currentTime + 0.2); // G5
                        gainNode.gain.setValueAtTime(0.1, audioContext.currentTime);
                        gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.5);
                        break;
                }
                
                oscillator.start(audioContext.currentTime);
                oscillator.stop(audioContext.currentTime + 0.5);
            }

            vibrate() {
                if ('vibrate' in navigator) {
                    navigator.vibrate([50, 30, 50]);
                }
            }

            toggleSound() {
                this.isMuted = !this.isMuted;
                this.soundIndicator.textContent = this.isMuted ? '🔇' : '🔊';
                this.soundIndicator.classList.toggle('muted', this.isMuted);
                
                if (!this.isMuted) {
                    this.playSound('click');
                }
                
                console.log('音效状态:', this.isMuted ? '关闭' : '开启');
            }

            changeSpeed(delta) {
                if (!this.isRunning) return; // 只在运行时允许调速
                
                const oldSpeed = this.speed;
                this.speed = Math.max(0.5, Math.min(3, this.speed + delta));
                
                if (oldSpeed !== this.speed) {
                    this.showSpeedIndicator();
                    this.playSound('tick');
                    console.log(`倍速调整: ${oldSpeed}x → ${this.speed}x`);
                }
            }

            showSpeedIndicator() {
                const indicator = document.createElement('div');
                indicator.textContent = `${this.speed}x`;
                indicator.style.cssText = `
                    position: absolute;
                    top: 50%;
                    right: 20px;
                    transform: translateY(-50%);
                    background: rgba(0,0,0,0.8);
                    color: white;
                    padding: 5px 10px;
                    border-radius: 15px;
                    font-size: 14px;
                    z-index: 200;
                    animation: fadeInOut 2s ease;
                `;
                
                document.body.appendChild(indicator);
                
                setTimeout(() => {
                    indicator.remove();
                }, 2000);
            }

            hideHintAfterDelay() {
                setTimeout(() => {
                    this.hintText.classList.add('hidden');
                }, 5000);
            }

            handleStartClick() {
                if (this.isRunning) {
                    console.log('倒计时正在进行中，忽略点击');
                    return;
                }
                this.playSound('click');
                this.vibrate();
                console.log('开始倒计时');
                this.startCountdown();
            }

            handleResetClick() {
                this.playSound('click');
                this.vibrate();
                console.log('重置倒计时');
                this.resetCountdown();
            }

            handlePauseClick() {
                if (!this.isRunning) return;
                
                this.isPaused = !this.isPaused;
                this.pauseBtn.textContent = this.isPaused ? '继续' : '暂停';
                this.playSound('click');
                
                if (this.isPaused) {
                    this.statusText.textContent = '已暂停';
                    this.statusText.classList.add('highlight');
                } else {
                    this.statusText.textContent = this.statusTexts[this.currentNumber];
                    this.statusText.classList.remove('highlight');
                }
                
                console.log('倒计时', this.isPaused ? '暂停' : '继续');
            }

            handleNumberClick() {
                // 检查数字元素是否存在
                if (!this.checkAndFixNumberElement()) {
                    console.warn('无法修复数字元素，忽略点击');
                    return;
                }
                
                if (this.isRunning && !this.isPaused) {
                    const oldSpeed = this.speed;
                    this.speed = Math.min(3, this.speed + 0.2); // 更细粒度的加速
                    
                    if (oldSpeed !== this.speed) {
                        this.showSpeedIndicator();
                        this.playSound('tick');
                        this.countdownNumber.classList.add('glow');
                        
                        // 添加加速的视觉反馈
                        const speedBoost = document.createElement('div');
                        speedBoost.textContent = '+';
                        speedBoost.style.cssText = `
                            position: absolute;
                            top: 20%;
                            right: 30%;
                            color: #ffd700;
                            font-size: 2rem;
                            font-weight: bold;
                            pointer-events: none;
                            animation: speedBoostAnim 0.6s ease-out forwards;
                        `;
                        
                        this.numberContainer.appendChild(speedBoost);
                        
                        setTimeout(() => {
                            if (this.countdownNumber) {
                                this.countdownNumber.classList.remove('glow');
                            }
                            speedBoost.remove();
                        }, 600);
                        
                        console.log(`点击加速: ${oldSpeed}x → ${this.speed}x`);
                    }
                }
            }

            updateDisplay() {
                // 更新状态文字
                this.statusText.textContent = this.statusTexts[this.currentNumber] || '';
                
                // 更新进度条
                const progress = ((this.totalCount - this.currentNumber) / this.totalCount) * 100;
                this.progressBar.style.width = progress + '%';
                
                console.log(`显示更新: 数字=${this.currentNumber}, 状态=${this.statusTexts[this.currentNumber]}`);
            }

            createNewNumber(number) {
                console.log(`创建新数字: ${number}`);
                // 创建新的数字元素
                const newNumberElement = document.createElement('div');
                newNumberElement.className = 'countdown-number';
                newNumberElement.textContent = number;
                newNumberElement.title = '点击加速';
                
                // 为新数字添加事件监听器
                newNumberElement.addEventListener('click', (e) => {
                    console.log('数字被点击');
                    this.createNumberRipple(e);
                    this.handleNumberClick();
                });
                
                newNumberElement.addEventListener('dblclick', () => {
                    console.log('数字被双击');
                    this.handlePauseClick();
                });
                
                return newNumberElement;
            }

            async slideToNextNumber() {
                if (this.currentNumber <= 0) return;
                
                console.log(`开始同步滑动，当前: ${this.currentNumber} → ${this.currentNumber - 1}`);
                
                // 同步滑动动画时长
                const slideDuration = 600; // 滑动动画时长（毫秒）
                
                // 获取当前数字元素 - 更robust的查找方式
                let currentNumberElement = this.countdownNumber;
                
                // 如果countdownNumber引用丢失，尝试从DOM中查找
                if (!currentNumberElement) {
                    console.warn('countdownNumber引用丢失，尝试从DOM查找...');
                    currentNumberElement = this.numberContainer.querySelector('.countdown-number');
                    if (currentNumberElement) {
                        this.countdownNumber = currentNumberElement;
                        console.log('从DOM成功找到当前数字元素');
                    }
                }
                
                // 如果还是找不到，创建一个默认元素
                if (!currentNumberElement) {
                    console.warn('无法找到当前数字元素，创建默认元素');
                    currentNumberElement = this.createNewNumber(this.currentNumber);
                    this.numberContainer.innerHTML = '';
                    this.numberContainer.appendChild(currentNumberElement);
                    this.countdownNumber = currentNumberElement;
                    console.log('创建了默认数字元素');
                }
                
                console.log(`当前数字元素:`, currentNumberElement);
                console.log(`当前数字内容:`, currentNumberElement.textContent);
                
                // 切换到下一个数字
                this.currentNumber--;
                this.playSound('tick');
                
                // 创建新数字元素
                const newNumberElement = this.createNewNumber(this.currentNumber);
                console.log(`新数字元素:`, newNumberElement);
                
                // 给新数字一个临时ID
                newNumberElement.id = 'number-new';
                
                // 将新数字添加到容器中
                this.numberContainer.appendChild(newNumberElement);
                
                console.log(`同步滑动开始: 旧数字${this.currentNumber + 1}向右滑出，新数字${this.currentNumber}从左滑入`);
                
                // 开始滑出动画
                currentNumberElement.classList.add('slide-out-right');
                console.log('添加滑出动画类');
                
                // 延迟50ms开始滑入动画
                setTimeout(() => {
                    newNumberElement.classList.add('slide-in-left');
                    console.log('添加滑入动画类');
                }, 50 / this.speed);
                
                // 在动画进行到30%时添加特效
                setTimeout(() => {
                    // 更新显示状态
                    this.updateDisplay();
                    this.statusText.classList.add('highlight');
                    
                    // 添加发光效果到新数字
                    newNumberElement.classList.add('glow');
                    
                    // 创建粒子效果
                    this.createParticles();
                    console.log('添加特效');
                }, (slideDuration * 0.3) / this.speed);
                
                // 等待滑动动画完成
                await this.delay(slideDuration / this.speed);
                
                // 清理工作
                // 移除旧数字元素
                if (currentNumberElement && currentNumberElement.parentNode) {
                    currentNumberElement.remove();
                    console.log('移除旧数字元素');
                }
                
                // 更新当前数字引用
                newNumberElement.id = 'number';
                this.countdownNumber = newNumberElement;
                
                // 清除动画效果
                newNumberElement.classList.remove('glow', 'slide-in-left');
                this.statusText.classList.remove('highlight');
                
                console.log(`同步滑动完成，当前显示: ${this.currentNumber}`);
                console.log(`更新后的countdownNumber引用:`, this.countdownNumber);
            }

            // 添加一个检查和修复数字元素的方法
            checkAndFixNumberElement() {
                if (!this.countdownNumber || !this.countdownNumber.parentNode) {
                    console.warn('检测到数字元素引用问题，尝试修复...');
                    
                    // 从DOM中查找数字元素
                    const existingNumber = this.numberContainer.querySelector('.countdown-number');
                    if (existingNumber) {
                        this.countdownNumber = existingNumber;
                        console.log('修复成功：重新建立数字元素引用');
                        return true;
                    } else {
                        // 重新创建数字元素
                        console.log('重新创建数字元素');
                        this.numberContainer.innerHTML = '';
                        const newNumber = this.createNewNumber(this.currentNumber);
                        this.numberContainer.appendChild(newNumber);
                        this.countdownNumber = newNumber;
                        return true;
                    }
                }
                return true;
            }

            async startCountdown() {
                if (this.isRunning) return;
                
                this.isRunning = true;
                this.isPaused = false;
                this.speed = 1;
                this.updateButtonStates();
                
                // 显示暂停按钮
                this.pauseBtn.classList.add('show');
                
                // 如果不是从5开始，先重置
                if (this.currentNumber !== this.totalCount) {
                    this.currentNumber = this.totalCount;
                    
                    // 清空容器重新创建初始数字
                    this.numberContainer.innerHTML = '';
                    const initialNumber = this.createNewNumber(this.currentNumber);
                    this.numberContainer.appendChild(initialNumber);
                    this.countdownNumber = initialNumber;
                    
                    this.updateDisplay();
                    await this.delay(500);
                }
                
                this.runCountdown();
            }

            async runCountdown() {
                console.log('开始倒计时循环');
                
                while (this.currentNumber > 0 && this.isRunning) {
                    console.log(`=== 倒计时阶段 ${this.currentNumber} 开始 ===`);
                    
                    // 检查并修复数字元素引用
                    this.checkAndFixNumberElement();
                    
                    // 精确控制每个数字的显示时间
                    const displayTime = 1200; // 每个数字显示1.2秒
                    
                    // 显示当前数字的时间（考虑倍速）
                    await this.delayWithPause(displayTime / this.speed);
                    
                    if (this.isRunning && !this.isPaused) {
                        console.log(`开始从 ${this.currentNumber} 切换`);
                        
                        // 精确的滑动切换
                        await this.slideToNextNumber();
                        
                        if (this.currentNumber === 0) {
                            console.log('=== 倒计时结束 ===');
                            // 在显示"开始！"后等待一下再完成
                            await this.delay(800);
                            this.completeCountdown();
                            break;
                        }
                        
                        console.log(`=== 倒计时阶段 ${this.currentNumber} 准备开始 ===`);
                    }
                }
            }

            // 增强版延时函数，支持更精确的时间控制
            async delayWithPause(ms) {
                return new Promise(resolve => {
                    const startTime = Date.now();
                    let remainingTime = ms;
                    
                    const checkStatus = () => {
                        if (!this.isRunning) {
                            console.log('倒计时已停止');
                            resolve();
                            return;
                        }
                        
                        if (this.isPaused) {
                            console.log('倒计时已暂停，等待继续...');
                            setTimeout(checkStatus, 50); // 暂停时每50ms检查一次
                            return;
                        }
                        
                        const elapsed = Date.now() - startTime;
                        remainingTime = ms - elapsed;
                        
                        if (remainingTime <= 0) {
                            console.log(`延时完成: ${ms}ms`);
                            resolve();
                        } else {
                            // 使用requestAnimationFrame确保更精确的时间控制
                            this.timer = setTimeout(() => {
                                requestAnimationFrame(checkStatus);
                            }, Math.min(remainingTime, 16)); // 最多16ms检查一次（约60fps）
                        }
                    };
                    
                    checkStatus();
                });
            }

            // 精确延时函数（不考虑暂停）
            async delay(ms) {
                return new Promise(resolve => {
                    console.log(`精确延时: ${ms}ms`);
                    this.timer = setTimeout(resolve, ms);
                });
            }

            createParticles() {
                const particleCount = 12;
                const container = this.numberDisplay;
                
                for (let i = 0; i < particleCount; i++) {
                    const particle = document.createElement('div');
                    particle.className = 'particle';
                    
                    // 从数字中心发散
                    const centerX = container.offsetWidth / 2;
                    const centerY = container.offsetHeight / 2;
                    
                    const angle = (i / particleCount) * Math.PI * 2;
                    const radius = Math.random() * 40 + 30;
                    
                    const x = centerX + Math.cos(angle) * radius;
                    const y = centerY + Math.sin(angle) * radius;
                    
                    particle.style.left = x + 'px';
                    particle.style.top = y + 'px';
                    particle.style.background = `hsl(${Math.random() * 60 + 200}, 80%, 60%)`;
                    particle.style.animationDelay = Math.random() * 0.3 + 's';
                    
                    container.appendChild(particle);
                    
                    setTimeout(() => {
                        particle.classList.add('animate');
                    }, 10);
                    
                    setTimeout(() => {
                        if (particle.parentNode) {
                            particle.remove();
                        }
                    }, 2500);
                }
            }

            completeCountdown() {
                console.log('显示完成效果');
                this.isRunning = false;
                this.isPaused = false;
                this.updateButtonStates();
                
                // 隐藏暂停按钮
                this.pauseBtn.classList.remove('show');
                
                // 播放完成音效
                this.playSound('complete');
                this.vibrate();
                
                // 显示完成覆盖层
                this.completionOverlay.classList.add('show');
                
                // 创建庆祝粒子
                this.createCelebrationParticles();
                
                // 3秒后自动隐藏
                setTimeout(() => {
                    this.completionOverlay.classList.remove('show');
                }, 3000);
            }

            createCelebrationParticles() {
                const particleCount = 25;
                const container = document.body;
                
                for (let i = 0; i < particleCount; i++) {
                    const particle = document.createElement('div');
                    particle.className = 'particle';
                    particle.style.background = `hsl(${Math.random() * 360}, 80%, 60%)`;
                    particle.style.width = Math.random() * 12 + 8 + 'px';
                    particle.style.height = particle.style.width;
                    
                    particle.style.left = Math.random() * window.innerWidth + 'px';
                    particle.style.top = Math.random() * window.innerHeight + 'px';
                    particle.style.animationDelay = Math.random() * 0.5 + 's';
                    particle.style.animationDuration = Math.random() * 2 + 2 + 's';
                    
                    container.appendChild(particle);
                    
                    setTimeout(() => {
                        particle.classList.add('animate');
                    }, 10);
                    
                    setTimeout(() => {
                        if (particle.parentNode) {
                            particle.remove();
                        }
                    }, 4000);
                }
            }

            resetCountdown() {
                console.log('重置倒计时');
                
                this.isRunning = false;
                this.isPaused = false;
                this.currentNumber = this.totalCount;
                this.speed = 1;
                
                if (this.timer) {
                    clearTimeout(this.timer);
                    this.timer = null;
                }
                
                // 隐藏暂停按钮
                this.pauseBtn.classList.remove('show');
                this.pauseBtn.textContent = '暂停';
                
                // 清空容器并重新创建初始数字
                this.numberContainer.innerHTML = '';
                const resetNumber = this.createNewNumber(this.currentNumber);
                this.numberContainer.appendChild(resetNumber);
                this.countdownNumber = resetNumber;
                
                this.updateDisplay();
                this.updateButtonStates();
                
                // 隐藏完成覆盖层
                this.completionOverlay.classList.remove('show');
                
                // 清除所有动画状态
                this.statusText.classList.remove('highlight');
                
                console.log('重置完成');
            }

            updateButtonStates() {
                if (this.isRunning) {
                    this.startBtn.disabled = true;
                    this.startBtn.textContent = '倒计时中...';
                } else {
                    this.startBtn.disabled = false;
                    this.startBtn.textContent = '开始倒计时';
                }
            }
        }

        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', () => {
            console.log('=== 页面加载完成，开始初始化 ===');
            
            // 检查关键元素是否存在
            const numberContainer = document.getElementById('numberContainer');
            console.log('数字容器:', numberContainer);
            
            if (!numberContainer) {
                console.error('数字容器未找到！');
                return;
            }
            
            console.log('开始创建倒计时实例');
            window.countdown = new SlidingCountdown();
            
            // 测试数字是否正确显示
            setTimeout(() => {
                const numberElement = numberContainer.querySelector('.countdown-number');
                console.log('检查数字元素:', numberElement);
                console.log('数字内容:', numberElement ? numberElement.textContent : '未找到');
                console.log('数字样式:', numberElement ? getComputedStyle(numberElement) : '无样式');
                
                if (numberElement) {
                    console.log('数字位置:', numberElement.getBoundingClientRect());
                }
            }, 1000);
            
            console.log('=== 初始化完成 ===');
        });

        // 调试用的全局函数
        window.testSlide = function() {
            if (window.countdown) {
                console.log('手动测试滑动');
                window.countdown.slideToNextNumber();
            }
        };

        window.testReset = function() {
            if (window.countdown) {
                console.log('手动测试重置');
                window.countdown.resetCountdown();
            }
        };

        // 快速测试函数
        window.quickTest = function() {
            if (window.countdown) {
                console.log('快速测试 - 连续滑动');
                let count = 0;
                const testInterval = setInterval(() => {
                    if (count < 5 && window.countdown.currentNumber > 0) {
                        window.countdown.slideToNextNumber();
                        count++;
                    } else {
                        clearInterval(testInterval);
                        console.log('快速测试完成');
                    }
                }, 1000);
            }
        };

        // 调试状态检查函数
        window.checkState = function() {
            if (window.countdown) {
                console.log('=== 当前状态检查 ===');
                console.log('当前数字:', window.countdown.currentNumber);
                console.log('是否运行:', window.countdown.isRunning);
                console.log('是否暂停:', window.countdown.isPaused);
                console.log('当前速度:', window.countdown.speed);
                console.log('countdownNumber引用:', window.countdown.countdownNumber);
                
                const container = document.getElementById('numberContainer');
                const numberElements = container.querySelectorAll('.countdown-number');
                console.log('DOM中的数字元素数量:', numberElements.length);
                numberElements.forEach((el, index) => {
                    console.log(`数字元素${index}:`, el.textContent, el);
                });
                console.log('=== 状态检查完成 ===');
            }
        };

        // 修复状态函数
        window.fixState = function() {
            if (window.countdown) {
                console.log('尝试修复状态...');
                const success = window.countdown.checkAndFixNumberElement();
                console.log('修复结果:', success ? '成功' : '失败');
                window.checkState();
            }
        };

        // 全局错误处理
        window.addEventListener('error', function(e) {
            console.error('全局错误:', e.error);
            if (window.countdown && e.error.message.includes('countdown')) {
                console.log('检测到倒计时相关错误，尝试修复...');
                window.fixState();
            }
        });

        console.log('测试函数已加载:');
        console.log('- testSlide(): 测试单次滑动');
        console.log('- testReset(): 重置到初始状态');
        console.log('- quickTest(): 快速连续滑动测试');
        console.log('- checkState(): 检查当前状态');
        console.log('- fixState(): 修复状态问题');
    </script>
</body>

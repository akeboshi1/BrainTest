<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>圆弧滑动倒计时</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .countdown-container {
            position: relative;
            width: 500px;
            height: 500px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 圆弧轨道 */
        .arc-track {
            position: absolute;
            width: 350px;
            height: 350px;
            border: 3px dashed rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation: trackGlow 3s ease-in-out infinite alternate;
        }

        @keyframes trackGlow {
            0% {
                border-color: rgba(255, 255, 255, 0.4);
                box-shadow: 0 0 0 rgba(255, 255, 255, 0.2);
            }
            100% {
                border-color: rgba(255, 255, 255, 0.8);
                box-shadow: 0 0 30px rgba(255, 255, 255, 0.4);
            }
        }

        /* SVG路径轨道 */
        .arc-path {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }

        .arc-path path {
            fill: none;
            stroke: rgba(255, 255, 255, 0.6);
            stroke-width: 2;
            stroke-dasharray: 8, 4;
            animation: dashMove 20s linear infinite;
        }

        @keyframes dashMove {
            0% {
                stroke-dashoffset: 0;
            }
            100% {
                stroke-dashoffset: -400;
            }
        }

        /* 数字容器 */
        .number-on-arc {
            position: absolute;
            width: 80px;
            height: 80px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 3rem;
            font-weight: bold;
            color: #fff;
            background: linear-gradient(135deg, #ff6b6b, #ee5a24);
            border-radius: 50%;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
            box-shadow: 
                0 8px 25px rgba(238, 90, 36, 0.4),
                inset 0 2px 0 rgba(255, 255, 255, 0.2);
            user-select: none;
            cursor: pointer;
            transition: all 0.3s ease;
            z-index: 10;
        }

        /* 当前数字高亮 */
        .number-on-arc.current {
            background: linear-gradient(135deg, #ffd700, #ffb347);
            color: #333;
            transform: scale(1.3);
            box-shadow: 
                0 15px 35px rgba(255, 215, 0, 0.6),
                0 0 40px rgba(255, 215, 0, 0.9),
                inset 0 2px 0 rgba(255, 255, 255, 0.3);
            animation: currentGlow 2s ease-in-out infinite alternate;
        }

        @keyframes currentGlow {
            0% {
                box-shadow: 
                    0 15px 35px rgba(255, 215, 0, 0.6),
                    0 0 40px rgba(255, 215, 0, 0.9),
                    inset 0 2px 0 rgba(255, 255, 255, 0.3);
            }
            100% {
                box-shadow: 
                    0 20px 45px rgba(255, 215, 0, 0.8),
                    0 0 60px rgba(255, 215, 0, 1),
                    inset 0 2px 0 rgba(255, 255, 255, 0.4);
            }
        }

        /* 圆弧滑动动画 */
        .slide-along-arc {
            animation: slideAlongArc var(--duration, 1s) var(--easing, cubic-bezier(0.25, 0.46, 0.45, 0.94)) forwards;
        }

        @keyframes slideAlongArc {
            0% {
                offset-distance: var(--start-distance, 0%);
                opacity: 1;
                transform: scale(1);
            }
            20% {
                transform: scale(1.1);
            }
            100% {
                offset-distance: var(--end-distance, 25%);
                opacity: 1;
                transform: scale(1);
            }
        }

        /* 圆弧同步滑动动画 - 旧数字沿圆弧滑出 */
        .arc-slide-out {
            animation: arcSlideOut 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
        }

        @keyframes arcSlideOut {
            from {
                opacity: 1;
            }
            to {
                opacity: 0;
                /* 最终位置将通过JavaScript动态设置 */
            }
        }

        /* 圆弧同步滑动动画 - 新数字沿圆弧滑入 */
        .arc-slide-in {
            animation: arcSlideIn 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
        }

        @keyframes arcSlideIn {
            from {
                opacity: 0;
                /* 起始位置将通过JavaScript动态设置 */
            }
            to {
                opacity: 1;
            }
        }

        /* 中心显示区域 */
        .center-display {
            position: absolute;
            width: 180px;
            height: 180px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: 
                0 20px 40px rgba(0, 0, 0, 0.2),
                inset 0 5px 15px rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(15px);
            z-index: 5;
        }

        .center-number {
            font-size: 4.5rem;
            font-weight: bold;
            color: #333;
            line-height: 1;
            text-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            transition: all 0.5s ease;
        }

        .center-text {
            font-size: 1.2rem;
            color: #666;
            margin-top: 8px;
            font-weight: 500;
            transition: all 0.5s ease;
        }

        .center-display.highlight .center-number {
            color: #ff6b6b;
            transform: scale(1.2);
        }

        .center-display.highlight .center-text {
            color: #ff6b6b;
        }

        /* 进度环 */
        .progress-ring {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(-90deg);
            z-index: 3;
        }

        .progress-ring circle {
            fill: none;
            stroke: rgba(255, 255, 255, 0.2);
            stroke-width: 4;
        }

        .progress-ring .progress {
            stroke: linear-gradient(90deg, #ffd700, #ffb347);
            stroke-dasharray: 1100;
            stroke-dashoffset: 1100;
            transition: stroke-dashoffset 0.5s ease;
            filter: drop-shadow(0 0 10px rgba(255, 215, 0, 0.6));
        }

        /* 控制按钮 */
        .controls {
            position: absolute;
            bottom: -120px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 20px;
        }

        /* 音效指示器 */
        .sound-indicator {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: linear-gradient(135deg, #9b59b6, #8e44ad);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(155, 89, 182, 0.3);
            font-size: 1.5rem;
            z-index: 20;
        }

        .sound-indicator:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 20px rgba(155, 89, 182, 0.4);
        }

        .sound-indicator.muted {
            background: #7f8c8d;
            box-shadow: 0 4px 15px rgba(127, 140, 141, 0.3);
        }

        /* 暂停按钮 */
        .pause-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            padding: 12px 24px;
            border: none;
            border-radius: 25px;
            background: linear-gradient(135deg, #f39c12, #e67e22);
            color: white;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(243, 156, 18, 0.3);
            opacity: 0;
            transform: translateY(-10px);
            z-index: 20;
        }

        .pause-btn.show {
            opacity: 1;
            transform: translateY(0);
        }

        .pause-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(243, 156, 18, 0.4);
        }

        /* 操作提示 */
        .hint-text {
            position: absolute;
            bottom: -180px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.7);
            text-align: center;
            opacity: 1;
            transition: opacity 0.3s ease;
            white-space: nowrap;
        }

        .hint-text.hidden {
            opacity: 0;
        }

        /* 控制按钮样式 */
        .control-btn {
            padding: 15px 30px;
            border: none;
            border-radius: 30px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.3);
            user-select: none;
        }

        .control-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 35px rgba(102, 126, 234, 0.4);
        }

        .control-btn:active {
            transform: translateY(0);
        }

        .control-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .control-btn.reset {
            background: linear-gradient(135deg, #f093fb, #f5576c);
            box-shadow: 0 8px 25px rgba(245, 87, 108, 0.3);
        }

        .control-btn.reset:hover {
            box-shadow: 0 12px 35px rgba(245, 87, 108, 0.4);
        }

        /* 波纹效果 */
        .ripple {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.6);
            transform: scale(0);
            animation: rippleEffect 0.6s linear;
            pointer-events: none;
        }

        @keyframes rippleEffect {
            to {
                transform: scale(4);
                opacity: 0;
            }
        }

        /* 加速动画效果 */
        @keyframes speedBoostAnim {
            0% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
            50% {
                opacity: 1;
                transform: translateY(-20px) scale(1.5);
            }
            100% {
                opacity: 0;
                transform: translateY(-40px) scale(0.5);
            }
        }

        /* 淡入淡出动画 */
        @keyframes fadeInOut {
            0%, 100% {
                opacity: 0;
                transform: translateY(-50%) scale(0.8);
            }
            15%, 85% {
                opacity: 1;
                transform: translateY(-50%) scale(1);
            }
        }

        /* 完成动画 */
        .completion-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, rgba(46, 204, 113, 0.95), rgba(39, 174, 96, 0.95));
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transform: scale(0.8);
            transition: all 0.5s ease;
            z-index: 100;
            backdrop-filter: blur(15px);
        }

        .completion-overlay.show {
            opacity: 1;
            transform: scale(1);
        }

        .completion-text {
            font-size: 6rem;
            color: white;
            font-weight: 300;
            margin-bottom: 20px;
            text-shadow: 0 3px 15px rgba(0, 0, 0, 0.3);
            animation: bounceIn 1s ease-out;
        }

        .completion-subtitle {
            font-size: 2.5rem;
            color: rgba(255, 255, 255, 0.9);
            font-weight: 400;
            animation: fadeInUp 1s ease-out 0.3s both;
        }

        @keyframes bounceIn {
            0% {
                opacity: 0;
                transform: scale(0.3) translateY(-100px);
            }
            50% {
                opacity: 1;
                transform: scale(1.05) translateY(0);
            }
            70% {
                transform: scale(0.9);
            }
            100% {
                transform: scale(1);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 粒子轨迹效果 */
        .trail-particle {
            position: absolute;
            width: 6px;
            height: 6px;
            background: #ffd700;
            border-radius: 50%;
            pointer-events: none;
            opacity: 0;
            z-index: 8;
        }

        .trail-particle.animate {
            animation: trailFloat 1.5s ease-out forwards;
        }

        @keyframes trailFloat {
            0% {
                opacity: 1;
                transform: scale(1);
            }
            100% {
                opacity: 0;
                transform: scale(0) translateY(-30px);
            }
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            .countdown-container {
                width: 400px;
                height: 400px;
            }
            
            .arc-track {
                width: 280px;
                height: 280px;
            }
            
            .center-number {
                font-size: 3.5rem;
            }
            
            .number-on-arc {
                width: 60px;
                height: 60px;
                font-size: 2.2rem;
            }
        }
    </style>
</head>
<body>
    <div class="countdown-container">
        <!-- 圆弧轨道 -->
        <div class="arc-track"></div>
        
        <!-- SVG路径 -->
        <svg class="arc-path" width="350" height="350" viewBox="0 0 350 350">
            <path id="arcPath" d="M 175,25 A 150,150 0 1,1 174.99,25" />
        </svg>
        
        <!-- 进度环 -->
        <svg class="progress-ring" width="380" height="380">
            <circle cx="190" cy="190" r="175" />
            <circle class="progress" cx="190" cy="190" r="175" id="progressCircle" />
        </svg>
        
        <!-- 音效指示器 -->
        <div class="sound-indicator" id="soundIndicator" title="点击切换音效">🔊</div>
        
        <!-- 暂停按钮 -->
        <button class="pause-btn" id="pauseBtn">暂停</button>
        
        <!-- 中心显示 -->
        <div class="center-display" id="centerDisplay">
            <div class="center-number" id="centerNumber">5</div>
            <div class="center-text" id="centerText">准备开始</div>
        </div>
        
        <!-- 控制按钮 -->
        <div class="controls">
            <button class="control-btn" id="startBtn">开始倒计时</button>
            <button class="control-btn reset" id="resetBtn">重置</button>
        </div>
        
        <!-- 操作提示 -->
        <div class="hint-text" id="hintText">
            空格键开始 | R键重置 | P键暂停 | 点击数字加速 | 双击中心暂停
        </div>
    </div>

    <!-- 完成覆盖层 -->
    <div class="completion-overlay" id="completionOverlay">
        <div class="completion-text">🎉</div>
        <div class="completion-subtitle">倒计时完成！</div>
    </div>

    <script>
        class CircularArcCountdown {
            constructor() {
                console.log('初始化圆弧滑动倒计时');
                
                this.container = document.querySelector('.countdown-container');
                this.centerDisplay = document.getElementById('centerDisplay');
                this.centerNumber = document.getElementById('centerNumber');
                this.centerText = document.getElementById('centerText');
                this.startBtn = document.getElementById('startBtn');
                this.resetBtn = document.getElementById('resetBtn');
                this.pauseBtn = document.getElementById('pauseBtn');
                this.soundIndicator = document.getElementById('soundIndicator');
                this.hintText = document.getElementById('hintText');
                this.completionOverlay = document.getElementById('completionOverlay');
                this.progressCircle = document.getElementById('progressCircle');
                
                this.currentNumber = 5;
                this.totalCount = 5;
                this.isRunning = false;
                this.isPaused = false;
                this.isMuted = false;
                this.speed = 1;
                this.timer = null;
                this.currentNumberElement = null;
                
                // 圆弧位置（角度）
                this.arcPositions = {
                    5: 0,   // 12点位置
                    4: 72,  // 2点位置
                    3: 144, // 5点位置
                    2: 216, // 7点位置
                    1: 288, // 10点位置
                    0: 360  // 回到12点位置
                };
                
                this.statusTexts = {
                    5: '准备开始',
                    4: '倒计时中',
                    3: '准备就绪',
                    2: '即将开始',
                    1: '最后一秒',
                    0: '开始！'
                };
                
                this.setupEventListeners();
                this.createInitialNumber();
                this.updateDisplay();
                
                console.log('圆弧滑动倒计时初始化完成');
            }

            setupEventListeners() {
                this.startBtn.addEventListener('click', (e) => {
                    this.createRipple(e);
                    this.handleStartClick();
                });
                this.resetBtn.addEventListener('click', (e) => {
                    this.createRipple(e);
                    this.handleResetClick();
                });
                this.pauseBtn.addEventListener('click', () => this.handlePauseClick());
                
                // 音效切换
                this.soundIndicator.addEventListener('click', () => {
                    this.toggleSound();
                });
                
                // 中心区域双击暂停
                this.centerDisplay.addEventListener('dblclick', () => {
                    this.handlePauseClick();
                });
                
                // 增强键盘快捷键
                document.addEventListener('keydown', (event) => {
                    switch(event.code) {
                        case 'Space':
                            event.preventDefault();
                            this.handleStartClick();
                            break;
                        case 'KeyR':
                            event.preventDefault();
                            this.handleResetClick();
                            break;
                        case 'KeyP':
                            event.preventDefault();
                            this.handlePauseClick();
                            break;
                        case 'KeyM':
                            event.preventDefault();
                            this.toggleSound();
                            break;
                        case 'ArrowUp':
                            event.preventDefault();
                            this.changeSpeed(0.5); // 加速
                            break;
                        case 'ArrowDown':
                            event.preventDefault();
                            this.changeSpeed(-0.5); // 减速
                            break;
                    }
                });
                
                // 窗口焦点事件 - 失焦时自动暂停
                window.addEventListener('blur', () => {
                    if (this.isRunning && !this.isPaused) {
                        this.handlePauseClick();
                    }
                });
                
                // 隐藏提示文字
                this.hideHintAfterDelay();
            }

            createInitialNumber() {
                this.currentNumberElement = this.createNumberElement(this.currentNumber);
                this.positionNumberOnArc(this.currentNumberElement, this.arcPositions[this.currentNumber]);
                this.container.appendChild(this.currentNumberElement);
                this.currentNumberElement.classList.add('current');
            }

            createNumberElement(number) {
                const element = document.createElement('div');
                element.className = 'number-on-arc';
                element.textContent = number;
                
                // 数字点击事件 - 加速
                element.addEventListener('click', (e) => {
                    this.createNumberRipple(e);
                    this.handleNumberClick();
                });
                
                // 数字双击事件 - 暂停
                element.addEventListener('dblclick', () => {
                    this.handlePauseClick();
                });
                
                return element;
            }

            positionNumberOnArc(element, angle) {
                const radius = 175; // 圆弧半径
                const centerX = 250; // 容器中心X
                const centerY = 250; // 容器中心Y
                
                // 将角度转换为弧度
                const radian = (angle - 90) * Math.PI / 180; // -90度使12点位置为起点
                
                // 计算位置
                const x = centerX + radius * Math.cos(radian);
                const y = centerY + radius * Math.sin(radian);
                
                element.style.position = 'absolute';
                element.style.left = (x - 40) + 'px'; // 减去元素宽度的一半
                element.style.top = (y - 40) + 'px';  // 减去元素高度的一半
            }

            async slideToNextPosition() {
                if (this.currentNumber <= 0) return;
                
                console.log(`开始圆弧同步滑动，当前: ${this.currentNumber} → ${this.currentNumber - 1}`);
                
                // 同步滑动动画时长
                const slideDuration = 800; // 滑动动画时长（毫秒）
                
                // 获取当前数字元素
                let currentNumberElement = this.currentNumberElement;
                
                // 如果当前元素丢失，尝试重新获取
                if (!currentNumberElement || !currentNumberElement.parentNode) {
                    console.warn('当前数字元素丢失，尝试重新获取...');
                    currentNumberElement = this.container.querySelector('.number-on-arc');
                    if (currentNumberElement) {
                        this.currentNumberElement = currentNumberElement;
                        console.log('成功重新获取当前数字元素');
                    }
                }
                
                // 如果还是找不到，创建一个默认元素
                if (!currentNumberElement) {
                    console.warn('无法找到当前数字元素，创建默认元素');
                    currentNumberElement = this.createNumberElement(this.currentNumber);
                    this.positionNumberOnArc(currentNumberElement, this.arcPositions[this.currentNumber]);
                    this.container.appendChild(currentNumberElement);
                    this.currentNumberElement = currentNumberElement;
                    currentNumberElement.classList.add('current');
                }
                
                console.log(`当前数字元素:`, currentNumberElement);
                console.log(`当前数字内容:`, currentNumberElement.textContent);
                
                // 计算起始和结束角度
                const startAngle = this.arcPositions[this.currentNumber];
                const endAngle = this.arcPositions[this.currentNumber - 1];
                
                // 切换到下一个数字
                this.currentNumber--;
                this.playSound('tick');
                
                // 创建新数字元素
                const newNumberElement = this.createNumberElement(this.currentNumber);
                console.log(`新数字元素:`, newNumberElement);
                
                // 将新数字定位到起始位置（前一个位置的角度）
                this.positionNumberOnArc(newNumberElement, startAngle);
                newNumberElement.style.opacity = '0'; // 初始透明
                
                // 添加新数字到容器
                this.container.appendChild(newNumberElement);
                
                console.log(`圆弧同步滑动开始: 旧数字${this.currentNumber + 1}向位置${endAngle}°滑出，新数字${this.currentNumber}从位置${startAngle}°滑入`);
                
                // 创建轨迹粒子
                this.createTrailParticles(startAngle, endAngle);
                
                // 开始同步圆弧滑动动画
                this.animateArcSliding(currentNumberElement, newNumberElement, startAngle, endAngle, slideDuration);
                
                // 在动画进行到30%时添加特效
                setTimeout(() => {
                    // 更新显示状态
                    this.updateDisplay();
                    this.centerDisplay.classList.add('highlight');
                    
                    // 添加发光效果到新数字
                    newNumberElement.classList.add('current');
                    
                    console.log('添加特效');
                }, (slideDuration * 0.3) / this.speed);
                
                // 等待滑动动画完成
                await this.delay(slideDuration / this.speed);
                
                // 清理工作
                // 移除旧数字元素
                if (currentNumberElement && currentNumberElement.parentNode) {
                    currentNumberElement.remove();
                    console.log('移除旧数字元素');
                }
                
                // 更新当前数字引用
                this.currentNumberElement = newNumberElement;
                
                // 清除动画类
                newNumberElement.classList.remove('arc-slide-in');
                this.centerDisplay.classList.remove('highlight');
                
                // 更新进度
                this.updateProgress();
                
                console.log(`圆弧同步滑动完成，当前显示: ${this.currentNumber}`);
                console.log(`更新后的currentNumberElement引用:`, this.currentNumberElement);
            }

            // 圆弧滑动动画函数
            animateArcSliding(oldElement, newElement, startAngle, endAngle, duration) {
                const startTime = performance.now();
                
                const animate = (currentTime) => {
                    const elapsed = currentTime - startTime;
                    const progress = Math.min(elapsed / (duration / this.speed), 1);
                    
                    // 使用缓动函数
                    const eased = this.easeInOutQuart(progress);
                    
                    // 计算当前角度
                    const currentAngle = startAngle + (endAngle - startAngle) * eased;
                    
                    // 更新旧数字位置（向目标角度滑出）
                    this.positionNumberOnArc(oldElement, currentAngle);
                    oldElement.style.opacity = 1 - eased; // 逐渐透明
                    
                    // 更新新数字位置（从前一个角度滑入到当前角度）
                    this.positionNumberOnArc(newElement, currentAngle);
                    newElement.style.opacity = eased; // 逐渐显现
                    
                    // 添加缩放效果
                    const scale = 1.3 + Math.sin(progress * Math.PI) * 0.1;
                    oldElement.style.transform += ` scale(${1.3 - eased * 0.1})`;
                    newElement.style.transform += ` scale(${scale})`;
                    
                    if (progress < 1) {
                        requestAnimationFrame(animate);
                    }
                };
                
                requestAnimationFrame(animate);
            }

            easeInOutQuart(t) {
                return t < 0.5 ? 8 * t * t * t * t : 1 - 8 * (--t) * t * t * t;
            }

            createTrailParticles(startAngle, endAngle) {
                const particleCount = 8;
                const angleStep = (endAngle - startAngle) / particleCount;
                
                for (let i = 0; i < particleCount; i++) {
                    const angle = startAngle + angleStep * i;
                    const particle = document.createElement('div');
                    particle.className = 'trail-particle';
                    
                    this.positionNumberOnArc(particle, angle);
                    this.container.appendChild(particle);
                    
                    setTimeout(() => {
                        particle.classList.add('animate');
                    }, i * 50);
                    
                    setTimeout(() => {
                        if (particle.parentNode) {
                            particle.remove();
                        }
                    }, 1500);
                }
            }

            updateDisplay() {
                this.centerNumber.textContent = this.currentNumber;
                this.centerText.textContent = this.statusTexts[this.currentNumber] || '';
                
                // 高亮中心显示
                this.centerDisplay.classList.add('highlight');
                setTimeout(() => {
                    this.centerDisplay.classList.remove('highlight');
                }, 500);
            }

            updateProgress() {
                const progress = ((this.totalCount - this.currentNumber) / this.totalCount) * 100;
                const circumference = 2 * Math.PI * 175;
                const offset = circumference - (progress / 100) * circumference;
                this.progressCircle.style.strokeDashoffset = offset;
            }

            handleStartClick() {
                if (this.isRunning) {
                    console.log('倒计时正在进行中');
                    return;
                }
                this.playSound('click');
                this.vibrate();
                console.log('开始圆弧倒计时');
                this.startCountdown();
            }

            handleResetClick() {
                this.playSound('click');
                this.vibrate();
                console.log('重置圆弧倒计时');
                this.resetCountdown();
            }

            handleNumberClick() {
                if (this.isRunning && !this.isPaused) {
                    const oldSpeed = this.speed;
                    this.speed = Math.min(2, this.speed + 0.2);
                    
                    if (oldSpeed !== this.speed) {
                        this.showSpeedIndicator();
                        this.playSound('tick');
                        this.currentNumberElement.classList.add('current');
                        
                        // 添加加速视觉反馈
                        const speedBoost = document.createElement('div');
                        speedBoost.textContent = '+';
                        speedBoost.style.cssText = `
                            position: absolute;
                            top: 20%;
                            right: 30%;
                            color: #ffd700;
                            font-size: 2rem;
                            font-weight: bold;
                            pointer-events: none;
                            animation: speedBoostAnim 0.6s ease-out forwards;
                        `;
                        
                        this.currentNumberElement.appendChild(speedBoost);
                        
                        setTimeout(() => {
                            speedBoost.remove();
                        }, 600);
                        
                        console.log(`点击加速: ${oldSpeed}x → ${this.speed}x`);
                    }
                }
            }

            async startCountdown() {
                if (this.isRunning) return;
                
                this.isRunning = true;
                this.isPaused = false;
                this.speed = 1;
                this.updateButtonStates();
                
                // 显示暂停按钮
                this.pauseBtn.classList.add('show');
                
                // 如果不是从5开始，先重置
                if (this.currentNumber !== this.totalCount) {
                    this.resetCountdown();
                    await this.delay(500);
                }
                
                this.runCountdown();
            }

            async runCountdown() {
                console.log('开始圆弧倒计时循环');
                
                while (this.currentNumber > 0 && this.isRunning) {
                    console.log(`圆弧倒计时阶段: ${this.currentNumber}`);
                    
                    // 等待1.5秒，支持暂停和倍速
                    await this.delayWithPause(1500 / this.speed);
                    
                    if (this.isRunning && !this.isPaused) {
                        // 沿圆弧滑动到下一个位置
                        await this.slideToNextPosition();
                        
                        if (this.currentNumber === 0) {
                            console.log('圆弧倒计时结束');
                            await this.delay(1000);
                            this.completeCountdown();
                            break;
                        }
                    }
                }
            }

            // 支持暂停的延时函数
            async delayWithPause(ms) {
                return new Promise(resolve => {
                    const startTime = Date.now();
                    let remainingTime = ms;
                    
                    const checkStatus = () => {
                        if (!this.isRunning) {
                            console.log('倒计时已停止');
                            resolve();
                            return;
                        }
                        
                        if (this.isPaused) {
                            console.log('倒计时已暂停，等待继续...');
                            setTimeout(checkStatus, 50);
                            return;
                        }
                        
                        const elapsed = Date.now() - startTime;
                        remainingTime = ms - elapsed;
                        
                        if (remainingTime <= 0) {
                            resolve();
                        } else {
                            this.timer = setTimeout(() => {
                                requestAnimationFrame(checkStatus);
                            }, Math.min(remainingTime, 16));
                        }
                    };
                    
                    checkStatus();
                });
            }

            completeCountdown() {
                console.log('显示完成效果');
                this.isRunning = false;
                this.isPaused = false;
                this.updateButtonStates();
                
                // 隐藏暂停按钮
                this.pauseBtn.classList.remove('show');
                this.pauseBtn.textContent = '暂停';
                
                // 播放完成音效
                this.playSound('complete');
                this.vibrate();
                
                // 最终爆炸效果
                this.createExplosionEffect();
                
                // 显示完成覆盖层
                this.completionOverlay.classList.add('show');
                
                // 3秒后自动隐藏
                setTimeout(() => {
                    this.completionOverlay.classList.remove('show');
                }, 3000);
            }

            createExplosionEffect() {
                const particleCount = 20;
                const centerX = 250;
                const centerY = 250;
                
                for (let i = 0; i < particleCount; i++) {
                    const particle = document.createElement('div');
                    particle.className = 'trail-particle';
                    particle.style.background = `hsl(${Math.random() * 360}, 80%, 60%)`;
                    particle.style.width = Math.random() * 12 + 6 + 'px';
                    particle.style.height = particle.style.width;
                    
                    const angle = (i / particleCount) * Math.PI * 2;
                    const distance = Math.random() * 100 + 50;
                    
                    const x = centerX + Math.cos(angle) * distance;
                    const y = centerY + Math.sin(angle) * distance;
                    
                    particle.style.left = (x - 3) + 'px';
                    particle.style.top = (y - 3) + 'px';
                    particle.style.animationDelay = Math.random() * 0.3 + 's';
                    
                    this.container.appendChild(particle);
                    
                    setTimeout(() => {
                        particle.classList.add('animate');
                    }, 10);
                    
                    setTimeout(() => {
                        if (particle.parentNode) {
                            particle.remove();
                        }
                    }, 2000);
                }
            }

            resetCountdown() {
                console.log('重置圆弧倒计时');
                
                this.isRunning = false;
                this.isPaused = false;
                this.speed = 1;
                this.currentNumber = this.totalCount;
                
                if (this.timer) {
                    clearTimeout(this.timer);
                    this.timer = null;
                }
                
                // 隐藏暂停按钮
                this.pauseBtn.classList.remove('show');
                this.pauseBtn.textContent = '暂停';
                
                // 移除所有圆弧上的数字元素
                const existingNumbers = this.container.querySelectorAll('.number-on-arc');
                existingNumbers.forEach(el => el.remove());
                
                // 重新创建初始数字
                this.createInitialNumber();
                this.updateDisplay();
                this.updateProgress();
                this.updateButtonStates();
                
                // 隐藏完成覆盖层
                this.completionOverlay.classList.remove('show');
                
                // 清除高亮状态
                this.centerDisplay.classList.remove('highlight');
                
                console.log('重置完成');
            }

            updateButtonStates() {
                if (this.isRunning) {
                    this.startBtn.disabled = true;
                    this.startBtn.textContent = '倒计时中...';
                } else {
                    this.startBtn.disabled = false;
                    this.startBtn.textContent = '开始倒计时';
                }
            }

            delay(ms) {
                return new Promise(resolve => {
                    this.timer = setTimeout(resolve, ms);
                });
            }

            handlePauseClick() {
                if (!this.isRunning) return;
                
                this.isPaused = !this.isPaused;
                this.pauseBtn.textContent = this.isPaused ? '继续' : '暂停';
                this.playSound('click');
                
                if (this.isPaused) {
                    this.centerText.textContent = '已暂停';
                    this.centerDisplay.classList.add('highlight');
                } else {
                    this.centerText.textContent = this.statusTexts[this.currentNumber];
                    this.centerDisplay.classList.remove('highlight');
                }
                
                console.log('倒计时', this.isPaused ? '暂停' : '继续');
            }

            toggleSound() {
                this.isMuted = !this.isMuted;
                if (this.isMuted) {
                    this.soundIndicator.classList.add('muted');
                } else {
                    this.soundIndicator.classList.remove('muted');
                }
            }

            changeSpeed(delta) {
                this.speed += delta;
                if (this.speed < 0.5) this.speed = 0.5;
                if (this.speed > 2) this.speed = 2;
            }

            hideHintAfterDelay() {
                setTimeout(() => {
                    this.hintText.classList.add('hidden');
                }, 5000);
            }

            // 创建波纹效果
            createRipple(e) {
                const button = e.currentTarget;
                const rect = button.getBoundingClientRect();
                const size = Math.max(rect.width, rect.height);
                const x = e.clientX - rect.left - size / 2;
                const y = e.clientY - rect.top - size / 2;
                
                const ripple = document.createElement('div');
                ripple.className = 'ripple';
                ripple.style.width = ripple.style.height = size + 'px';
                ripple.style.left = x + 'px';
                ripple.style.top = y + 'px';
                
                button.appendChild(ripple);
                
                setTimeout(() => {
                    ripple.remove();
                }, 600);
            }

            // 创建数字波纹效果
            createNumberRipple(e) {
                const number = e.currentTarget;
                const rect = number.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                
                const ripple = document.createElement('div');
                ripple.className = 'ripple';
                ripple.style.width = ripple.style.height = '100px';
                ripple.style.left = (x - 50) + 'px';
                ripple.style.top = (y - 50) + 'px';
                ripple.style.background = 'rgba(255, 215, 0, 0.6)';
                
                number.appendChild(ripple);
                
                setTimeout(() => {
                    ripple.remove();
                }, 600);
            }

            // 播放音效
            playSound(type = 'click') {
                if (this.isMuted) return;
                
                const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();
                
                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);
                
                switch(type) {
                    case 'click':
                        oscillator.frequency.setValueAtTime(800, audioContext.currentTime);
                        gainNode.gain.setValueAtTime(0.1, audioContext.currentTime);
                        gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.1);
                        break;
                    case 'tick':
                        oscillator.frequency.setValueAtTime(1000, audioContext.currentTime);
                        gainNode.gain.setValueAtTime(0.05, audioContext.currentTime);
                        gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.2);
                        break;
                    case 'complete':
                        oscillator.frequency.setValueAtTime(523, audioContext.currentTime);
                        gainNode.gain.setValueAtTime(0.1, audioContext.currentTime);
                        gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.5);
                        break;
                }
                
                oscillator.start(audioContext.currentTime);
                oscillator.stop(audioContext.currentTime + 0.5);
            }

            // 震动反馈
            vibrate() {
                if ('vibrate' in navigator) {
                    navigator.vibrate([50, 30, 50]);
                }
            }

            // 显示速度指示器
            showSpeedIndicator() {
                const indicator = document.createElement('div');
                indicator.textContent = `${this.speed}x`;
                indicator.style.cssText = `
                    position: absolute;
                    top: 50%;
                    right: 30px;
                    transform: translateY(-50%);
                    background: rgba(0,0,0,0.8);
                    color: white;
                    padding: 8px 15px;
                    border-radius: 20px;
                    font-size: 16px;
                    font-weight: bold;
                    z-index: 200;
                    animation: fadeInOut 2s ease;
                `;
                
                this.container.appendChild(indicator);
                
                setTimeout(() => {
                    indicator.remove();
                }, 2000);
            }
        }

        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', () => {
            console.log('页面加载完成，初始化圆弧滑动倒计时');
            window.countdown = new CircularArcCountdown();
        });

        // 调试函数
        window.testArcSlide = function() {
            if (window.countdown) {
                console.log('测试圆弧滑动');
                window.countdown.slideToNextPosition();
            }
        };

        // 测试快速圆弧滑动
        window.quickArcTest = function() {
            if (window.countdown) {
                console.log('快速圆弧滑动测试');
                let count = 0;
                const testInterval = setInterval(() => {
                    if (count < 5 && window.countdown.currentNumber > 0) {
                        window.countdown.slideToNextPosition();
                        count++;
                    } else {
                        clearInterval(testInterval);
                        console.log('快速圆弧滑动测试完成');
                    }
                }, 1200);
            }
        };

        console.log('圆弧滑动倒计时加载完成！');
        console.log('测试函数: testArcSlide() - 单次圆弧滑动测试');
        console.log('测试函数: quickArcTest() - 快速连续圆弧滑动测试');
    </script>
</body>

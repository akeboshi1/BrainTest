<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数字天平</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f0f0f0;
            margin: 0;
            padding: 20px;
        }
        .game-container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        h1 {
            color: #333;
        }
        .instructions {
            margin-bottom: 20px;
            color: #666;
        }
        .balance {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 30px 0;
            position: relative;
        }
        .scale {
            width: 400px;
            height: 200px;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200"><rect x="190" y="150" width="20" height="50" fill="%23CD7F32"/><rect x="175" y="180" width="50" height="20" fill="%23CD7F32"/></svg>');
            background-repeat: no-repeat;
            position: relative;
        }
        .beam {
            width: 300px;
            height: 10px;
            background-color: #8B4513;
            position: absolute;
            top: 150px;
            left: 50px;
            transform-origin: center;
            transition: transform 0.5s;
        }
        .pan {
            width: 80px;
            height: 20px;
            background-color: #A0522D;
            border-radius: 5px;
            position: absolute;
            top: 140px;
        }
        .pan.left {
            left: 30px;
        }
        .pan.right {
            right: 30px;
        }
        .weight-container {
            display: flex;
            justify-content: space-around;
            margin: 30px 0;
        }
        .number-slot {
            width: 60px;
            height: 60px;
            border: 2px solid #333;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
            background-color: #FFA500;
            color: white;
            margin: 0 5px;
            transition: transform 0.2s;
        }
        .number-slot:hover {
            transform: scale(1.1);
        }
        .number-slot.selected {
            background-color: #FF4500;
        }
        .empty-slot {
            width: 60px;
            height: 60px;
            border: 2px dashed #999;
            border-radius: 10px;
            margin: 0 5px;
        }
        .control-buttons {
            margin-top: 20px;
        }
        button {
            padding: 10px 20px;
            margin: 0 10px;
            font-size: 16px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #45a049;
        }
        #result {
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
            height: 30px;
        }
        .level-info {
            margin-bottom: 15px;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>数字天平</h1>
        <div class="instructions">
            <p>请你试着将四个数字砝码放到天平上，并且能夠维持平衡。</p>
            <p>左右两边的砝码总和必须相等才能平衡！</p>
        </div>
        
        <div class="level-info">
            <p>当前关卡: <span id="current-level">1</span></p>
        </div>
        
        <div class="balance">
            <div class="scale">
                <div class="beam" id="beam"></div>
                <div class="pan left"></div>
                <div class="pan right"></div>
            </div>
        </div>
        
        <div class="weight-container">
            <div id="left-side">
                <div class="empty-slot" id="left-slot-1" ondrop="drop(event)" ondragover="allowDrop(event)"></div>
                <div class="empty-slot" id="left-slot-2" ondrop="drop(event)" ondragover="allowDrop(event)"></div>
            </div>
            <div id="right-side">
                <div class="empty-slot" id="right-slot-1" ondrop="drop(event)" ondragover="allowDrop(event)"></div>
                <div class="empty-slot" id="right-slot-2" ondrop="drop(event)" ondragover="allowDrop(event)"></div>
            </div>
        </div>
        
        <div id="available-numbers"></div>
        
        <div class="control-buttons">
            <button id="check-balance">检查平衡</button>
            <button id="reset">重置</button>
            <button id="next-level">下一关</button>
        </div>
        
        <div id="result"></div>
    </div>
    
    <script>
        // 训练状态
        let gameState = {
            currentLevel: 1,
            leftSlots: [null, null],
            rightSlots: [null, null],
            availableNumbers: [],
            levels: [
                { numbers: [5, 2, 6, 3] },
                { numbers: [8, 4, 6, 6] },
                { numbers: [7, 3, 5, 5] },
                { numbers: [9, 8, 5, 12] },
                { numbers: [10, 6, 4, 12] }
            ]
        };
        
        // 初始化训练
        function initGame() {
            updateLevelDisplay();
            loadAvailableNumbers();
            resetGame();
        }
        
        // 更新关卡显示
        function updateLevelDisplay() {
            document.getElementById('current-level').textContent = gameState.currentLevel;
        }
        
        // 加载可用数字
        function loadAvailableNumbers() {
            const currentLevelData = gameState.levels[gameState.currentLevel - 1];
            gameState.availableNumbers = [...currentLevelData.numbers];
            
            const numbersContainer = document.getElementById('available-numbers');
            numbersContainer.innerHTML = '';
            
            gameState.availableNumbers.forEach((num, index) => {
                const numberSlot = document.createElement('div');
                numberSlot.className = 'number-slot';
                numberSlot.textContent = num;
                numberSlot.setAttribute('draggable', 'true');
                numberSlot.setAttribute('id', `number-${index}`);
                numberSlot.addEventListener('dragstart', drag);
                numberSlot.addEventListener('click', selectNumber);
                
                numbersContainer.appendChild(numberSlot);
            });
        }
        
        // 重置训练
        function resetGame() {
            gameState.leftSlots = [null, null];
            gameState.rightSlots = [null, null];
            
            // 清空所有槽位
            document.querySelectorAll('.empty-slot').forEach(slot => {
                slot.innerHTML = '';
                slot.className = 'empty-slot';
            });
            
            // 重置天平
            document.getElementById('beam').style.transform = 'rotate(0deg)';
            
            // 重置结果提示
            document.getElementById('result').textContent = '';
            
            // 重新启用所有数字
            document.querySelectorAll('.number-slot').forEach(numSlot => {
                numSlot.style.visibility = 'visible';
                numSlot.classList.remove('selected');
            });
        }
        
        // 选择数字
        function selectNumber(event) {
            const selectedNumber = event.target;
            
            // 如果数字已被选中，取消选中
            if (selectedNumber.classList.contains('selected')) {
                selectedNumber.classList.remove('selected');
                return;
            }
            
            // 取消其他选中状态
            document.querySelectorAll('.number-slot.selected').forEach(slot => {
                slot.classList.remove('selected');
            });
            
            // 选中当前数字
            selectedNumber.classList.add('selected');
        }
        
        // 允许放置
        function allowDrop(event) {
            event.preventDefault();
        }
        
        // 拖动开始
        function drag(event) {
            event.dataTransfer.setData("text", event.target.id);
        }
        
        // 放置
        function drop(event) {
            event.preventDefault();
            const data = event.dataTransfer.getData("text");
            const draggedElement = document.getElementById(data);
            
            // 如果目标区域已有砝码，则不允许放置
            if (event.target.childNodes.length > 0) return;
            
            // 克隆一个新元素放到目标位置
            const clone = draggedElement.cloneNode(true);
            clone.setAttribute('draggable', 'false');
            event.target.appendChild(clone);
            
            // 更新训练状态
            const targetId = event.target.id;
            const numberValue = parseInt(draggedElement.textContent);
            
            if (targetId.includes('left-slot')) {
                const index = parseInt(targetId.split('-')[2]) - 1;
                gameState.leftSlots[index] = numberValue;
            } else if (targetId.includes('right-slot')) {
                const index = parseInt(targetId.split('-')[2]) - 1;
                gameState.rightSlots[index] = numberValue;
            }
            
            // 隐藏原始元素
            draggedElement.style.visibility = 'hidden';
        }
        
        // 检查天平是否平衡
        function checkBalance() {
            // 计算左右两边的总和
            const leftSum = gameState.leftSlots.reduce((sum, num) => sum + (num || 0), 0);
            const rightSum = gameState.rightSlots.reduce((sum, num) => sum + (num || 0), 0);
            
            const beam = document.getElementById('beam');
            const resultElement = document.getElementById('result');
            
            // 检查是否所有位置都已放置砝码
            const allSlotsUsed = !gameState.leftSlots.includes(null) && !gameState.rightSlots.includes(null);
            
            if (!allSlotsUsed) {
                resultElement.textContent = '请先放置所有砝码！';
                resultElement.style.color = 'orange';
                return;
            }
            
            if (leftSum > rightSum) {
                beam.style.transform = 'rotate(-10deg)';
                resultElement.textContent = '左边更重，天平失衡！';
                resultElement.style.color = 'red';
            } else if (rightSum > leftSum) {
                beam.style.transform = 'rotate(10deg)';
                resultElement.textContent = '右边更重，天平失衡！';
                resultElement.style.color = 'red';
            } else {
                beam.style.transform = 'rotate(0deg)';
                resultElement.textContent = '恭喜！天平平衡了！';
                resultElement.style.color = 'green';
            }
        }
        
        // 进入下一关
        function nextLevel() {
            if (gameState.currentLevel < gameState.levels.length) {
                gameState.currentLevel++;
                updateLevelDisplay();
                loadAvailableNumbers();
                resetGame();
            } else {
                alert('恭喜你已经完成所有关卡！');
            }
        }
        
        // 事件监听器
        document.getElementById('check-balance').addEventListener('click', checkBalance);
        document.getElementById('reset').addEventListener('click', resetGame);
        document.getElementById('next-level').addEventListener('click', nextLevel);
        
        // 点击空槽位放置选中的数字
        document.querySelectorAll('.empty-slot').forEach(slot => {
            slot.addEventListener('click', function(event) {
                const selectedNumber = document.querySelector('.number-slot.selected');
                if (selectedNumber && event.target.childNodes.length === 0) {
                    // 克隆并放置选中的数字
                    const clone = selectedNumber.cloneNode(true);
                    clone.setAttribute('draggable', 'false');
                    event.target.appendChild(clone);
                    
                    // 更新训练状态
                    const targetId = event.target.id;
                    const numberValue = parseInt(selectedNumber.textContent);
                    
                    if (targetId.includes('left-slot')) {
                        const index = parseInt(targetId.split('-')[2]) - 1;
                        gameState.leftSlots[index] = numberValue;
                    } else if (targetId.includes('right-slot')) {
                        const index = parseInt(targetId.split('-')[2]) - 1;
                        gameState.rightSlots[index] = numberValue;
                    }
                    
                    // 隐藏原始元素
                    selectedNumber.style.visibility = 'hidden';
                    selectedNumber.classList.remove('selected');
                }
            });
        });
        
        // 初始化训练
        initGame();
    </script>
</body>
</html>

    <title>Recorder</title>

<body>
<div>
    <canvas id="waveform" width="80" height="80"></canvas>
</div>

<script src="index.umd.js"></script>
<script>
  let flag = false;
  let audioChunks = [];
  let audioContext = null;

  class AudioRecorder {
    constructor(params) {
      this._id = Math.random().toString(36).substr(2);
      this.isConnected = false;

      this.recorder = new RecorderManager("../");
      this.resultText = "";
      this.resultTextTemp = "";
      this.recordFlag = true;
      
      const {
        onStop,
        onSendMsgCallback,
      } = params;

      this.onSendMsgCallback = onSendMsgCallback;

      this.recorder.onFrameRecorded = ({isLastFrame, frameBuffer}) => {
        // 保存音频数据
        audioChunks.push(frameBuffer);

        if (isLastFrame) {
          console.log("最后一帧");
        }
      };
      this.recorder.onStop = onStop;
    }

    stop() {
      console.log('停止录音');
      this.recorder.stop();
      
      // 直接使用合并生成WAV文件的方法
      this.createAndUploadWAV();
      
      // 清空音频数据缓存
      audioChunks = [];
    }
    
    // 合并生成WAV文件并上传
    createAndUploadWAV() {
      if (audioChunks.length === 0) {
        console.error("没有录音数据");
        return;
      }
      
      console.log("开始处理音频数据", audioChunks.length, "帧");
      
      // 合并所有音频数据
      const audioData = this.concatenateAudioData(audioChunks);
      
      // 创建WAV文件
      const wavBlob = this.createWAVFile(audioData);
      console.log("合并生成WAV格式音频数据", wavBlob);
      
      // 上传音频文件
      this.uploadAudio(wavBlob);
    }
    
    // 合并音频数据
    concatenateAudioData(chunks) {
      let totalLength = 0;
      
      // 计算总长度
      for (let i = 0; i < chunks.length; i++) {
        totalLength += chunks[i].byteLength;
      }
      
      console.log("音频数据总长度:", totalLength, "字节");
      
      // 创建新的ArrayBuffer
      const result = new ArrayBuffer(totalLength);
      const view = new Uint8Array(result);
      
      // 合并数据
      let offset = 0;
      for (let i = 0; i < chunks.length; i++) {
        const chunk = new Uint8Array(chunks[i]);
        view.set(chunk, offset);
        offset += chunk.byteLength;
      }
      
      return view.buffer;
    }
    
    // 创建标准WAV文件格式
    createWAVFile(audioData) {
      const sampleRate = 16000;
      const numChannels = 1;
      const bitsPerSample = 16;
      
      // WAV文件头（44字节）
      const headerLength = 44;
      const wavLength = audioData.byteLength + headerLength;
      const header = new ArrayBuffer(headerLength);
      const view = new DataView(header);
      
      // RIFF块标识符
      view.setUint8(0, 'R'.charCodeAt(0));
      view.setUint8(1, 'I'.charCodeAt(0));
      view.setUint8(2, 'F'.charCodeAt(0));
      view.setUint8(3, 'F'.charCodeAt(0));
      
      // RIFF块大小
      view.setUint32(4, wavLength - 8, true);
      
      // WAVE格式
      view.setUint8(8, 'W'.charCodeAt(0));
      view.setUint8(9, 'A'.charCodeAt(0));
      view.setUint8(10, 'V'.charCodeAt(0));
      view.setUint8(11, 'E'.charCodeAt(0));
      
      // fmt子块标识符
      view.setUint8(12, 'f'.charCodeAt(0));
      view.setUint8(13, 'm'.charCodeAt(0));
      view.setUint8(14, 't'.charCodeAt(0));
      view.setUint8(15, ' '.charCodeAt(0));
      
      // fmt子块大小（16 for PCM）
      view.setUint32(16, 16, true);
      
      // 音频格式（1表示PCM）
      view.setUint16(20, 1, true);
      
      // 声道数
      view.setUint16(22, numChannels, true);
      
      // 采样率
      view.setUint32(24, sampleRate, true);
      
      // 字节率 = 采样率 * 声道数 * 位深度/8
      view.setUint32(28, sampleRate * numChannels * bitsPerSample / 8, true);
      
      // 块对齐 = 声道数 * 位深度/8
      view.setUint16(32, numChannels * bitsPerSample / 8, true);
      
      // 位深度
      view.setUint16(34, bitsPerSample, true);
      
      // data子块标识符
      view.setUint8(36, 'd'.charCodeAt(0));
      view.setUint8(37, 'a'.charCodeAt(0));
      view.setUint8(38, 't'.charCodeAt(0));
      view.setUint8(39, 'a'.charCodeAt(0));
      
      // data子块大小
      view.setUint32(40, audioData.byteLength, true);
      
      // 合并文件头和音频数据
      const wavData = new Uint8Array(wavLength);
      wavData.set(new Uint8Array(header), 0);
      wavData.set(new Uint8Array(audioData), headerLength);
      
      // 创建Blob对象
      return new Blob([wavData], { type: 'audio/wav' });
    }
    
    uploadAudio(audioBlob) {
      console.log("uploadAudio", audioBlob);

      const formData = new FormData();
      formData.append('file', audioBlob, 'recording.wav');
      
      // 发送POST请求上传音频文件
      fetch('https://test.paipai.xinjiaxianglao.com/fsr/', {
        method: 'POST',
        body: formData
      })
      .then(response => response.json())
      .then(result => {
        console.log('上传结果:', result);
        
        // 发送结果到父窗口
        const targetOrigin = `${location.protocol}//${location.host}/fsr.html`;
        result.code = 0;

        window.parent.postMessage({
          type: 'FSRResult',
          data: result
        }, targetOrigin);
      })
      .catch(error => {
        console.error('上传错误:', error);
        const targetOrigin = `${location.protocol}//${location.host}/fsr.html`;
        window.parent.postMessage({
          type: 'FSRResult',
          data: {code: 2, error: '识别失败'}
        }, targetOrigin);
      });
      
    }

    start(params) {
      // 开始录音
      this.isConnected = true;

      this.recorder.start({
        sampleRate: 16000,
        frameSize: 1280,
      });
      
    }
  }

  const audioRecorder = new AudioRecorder({
    onStop: () => {
      console.log('停止录音');
    },
    onSendMsgCallback: (text) => {
      console.log('发送文本', text);
    }
  });

  function start(params) {
    audioRecorder.start(params);
  }

  function stop() {
    audioRecorder.stop();
  }

</script>
